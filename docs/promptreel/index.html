<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promptreel — AI videos &amp; prompts</title>
  <meta name="description" content="Ready-made AI videos and the proven prompts behind them. Buy a single prompt or clip, or subscribe to unlock the whole library." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0e0c; --panel: #151512; --stripe: #1a1a17; --line: #26251f; --line-2: #3a3931;
      --text: #f2efe8; --text-2: #e6e2d8; --muted: #b7b4ab; --dim: #8b8a84;
      --accent: #d4ff3a; --ok-bg: #1d2410; --ok-line: #4a5a1a;
      --serif: 'Instrument Serif', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
      --pad-x: clamp(16px, 4vw, 48px);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Geist, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--text); }
    input, textarea, select, button { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3 { margin: 0; }
    p { margin: 0; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .mono { font-family: var(--mono); }
    .serif { font-family: var(--serif); font-weight: 400; }

    /* Header */
    header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap;
      padding: 14px var(--pad-x); background: rgba(14,14,12,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .logo { display: flex; align-items: baseline; gap: 8px; cursor: pointer; background: none; border: 0; color: var(--text); padding: 0; }
    .logo span:first-child { font-family: var(--serif); font-size: 28px; line-height: 1; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    nav { display: flex; gap: 2px; flex: 1 1 auto; flex-wrap: wrap; min-width: 0; }
    .search { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; min-width: 140px; flex: 0 1 200px; }
    .search span { font-size: 13px; color: var(--dim); }
    .search input { background: transparent; border: 0; outline: 0; color: var(--text); font-size: 14px; width: 100%; min-width: 0; }
    .plan-badge { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--dim); white-space: nowrap; }
    .plan-badge.paid { border-color: var(--ok-line); color: var(--accent); }

    /* Buttons */
    .tab { background: transparent; color: var(--muted); border: 0; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; }
    .tab.on { background: var(--text); color: var(--bg); }
    .tab.sm { padding: 6px 12px; font-size: 12px; font-weight: 400; }
    .tab.md { padding: 8px 16px; font-size: 13px; }
    .tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
    .btn { border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 9px 16px; white-space: nowrap; }
    .btn-accent { background: var(--accent); color: var(--bg); border: 1px solid var(--accent); }
    .btn-light { background: var(--text); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line-2); font-weight: 400; }
    .btn-link { background: transparent; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; padding: 0; }
    .back { align-self: flex-start; background: transparent; border: 0; color: var(--dim); font-size: 14px; padding: 0; }
    .chip { background: transparent; color: var(--text); border: 1px solid var(--line-2); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .chip small { font-family: var(--mono); font-size: 11px; opacity: .6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    main { padding: clamp(24px,5vw,64px) var(--pad-x); display: flex; flex-direction: column; gap: 36px; }
    .eyebrow { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; }
    .eyebrow.accent { color: var(--accent); font-size: 12px; letter-spacing: .06em; }
    .lead { color: var(--muted); font-size: 17px; line-height: 1.5; text-wrap: pretty; }

    /* Browse */
    .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,420px), 1fr)); gap: 24px; align-items: end; }
    .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(44px,7vw,92px); line-height: .95; letter-spacing: -.02em; text-wrap: balance; }
    .hero em { color: var(--accent); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 28px 20px; }
    .card { cursor: pointer; display: flex; flex-direction: column; gap: 12px; background: none; border: 0; padding: 0; color: inherit; text-align: left; }
    .card:hover { opacity: .85; }
    .thumb { position: relative; aspect-ratio: 9/16; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
    .tag { position: absolute; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; padding: 4px 7px; border-radius: 4px; background: var(--bg); color: var(--text); white-space: nowrap; }
    .tag.lit { background: var(--accent); color: var(--bg); }
    .play { position: absolute; inset: 0; display: grid; place-items: center; }
    .play span { width: 48px; height: 48px; border-radius: 50%; background: rgba(14,14,12,.8); display: grid; place-items: center; color: var(--accent); font-size: 16px; }
    .card h3 { font-size: 15px; font-weight: 500; line-height: 1.3; text-wrap: pretty; }
    .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .price { font-size: 14px; font-weight: 600; }
    .price.lit { color: var(--accent); }
    .empty { padding: 48px 0; text-align: center; color: var(--dim); }

    /* Detail */
    .detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,340px), 1fr)); gap: clamp(24px,4vw,56px); align-items: start; }
    .player-wrap { position: sticky; top: 96px; max-width: 400px; width: 100%; justify-self: center; display: flex; flex-direction: column; gap: 12px; }
    .player { position: relative; aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
    .player .play span { width: 72px; height: 72px; background: rgba(14,14,12,.85); font-size: 24px; }
    .watermark { position: absolute; inset: auto 0 40% 0; text-align: center; font-family: var(--serif); font-size: 44px; color: rgba(242,239,232,.28); transform: rotate(-18deg); letter-spacing: .04em; pointer-events: none; }
    .progress { position: absolute; left: 14px; right: 14px; bottom: 14px; height: 3px; border-radius: 2px; background: rgba(242,239,232,.25); }
    .progress div { width: 34%; height: 100%; border-radius: 2px; background: var(--accent); }
    .stat-line { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .info { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
    .info h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(36px,4.5vw,58px); line-height: 1; text-wrap: balance; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta span { display: flex; gap: 6px; white-space: nowrap; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
    .meta i { color: var(--dim); font-style: normal; }
    .offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .offer { border: 1px solid var(--line-2); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); }
    .offer.hi { border-color: var(--accent); }
    .offer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .offer-head b { font-size: 15px; font-weight: 600; }
    .offer-head span { font-family: var(--serif); font-size: 32px; line-height: 1; }
    .offer p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .offer .btn { margin-top: auto; padding: 10px; }
    .hint-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border-radius: 12px; border: 1px dashed var(--line-2); font-size: 14px; color: var(--muted); }
    .ok-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border-radius: 12px; background: var(--ok-bg); border: 1px solid var(--ok-line); }
    .ok-bar > span { color: var(--accent); font-weight: 600; font-size: 14px; }
    .ok-bar .btn { margin-left: auto; font-size: 13px; }
    .prompt-box { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
    .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .prompt-head .btn { font-family: Geist, system-ui, sans-serif; font-size: 13px; padding: 8px 16px; }
    .prompt-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; font-family: var(--mono); font-size: 13px; line-height: 1.65; }
    .sec { display: grid; grid-template-columns: minmax(0,100px) minmax(0,1fr); gap: 16px; }
    .sec b { color: var(--accent); font-size: 11px; font-weight: 400; letter-spacing: .06em; padding-top: 2px; }
    .sec span { color: var(--text-2); white-space: pre-wrap; text-wrap: pretty; }
    .blur { filter: blur(5px); user-select: none; }
    .blur-sm { filter: blur(4px); user-select: none; }
    .related { display: flex; flex-direction: column; gap: 18px; border-top: 1px solid var(--line); padding-top: 28px; }
    .related h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; }
    .related .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .related .card { gap: 8px; }
    .related .thumb { border-radius: 8px; }
    .related .card > span { font-size: 13px; line-height: 1.3; }

    /* Section heads */
    .page-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; }
    .page-head h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px,5vw,72px); line-height: 1; }
    .page-head p { color: var(--muted); font-size: 16px; line-height: 1.5; }

    /* Prompt library */
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%,340px), 1fr)); gap: 16px; }
    .pcard { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
    .pcard-top, .pcard-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; }
    .pcard-top { border-bottom: 1px solid var(--line); }
    .pcard-top .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pcard-top .tag { position: static; font-size: 10px; padding: 3px 7px; }
    .pcard-foot { border-top: 1px solid var(--line); }
    .pcard-foot .btn { font-size: 13px; padding: 8px 14px; }
    .pcard-body { cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; background: none; border: 0; color: inherit; text-align: left; }
    .pcard-body h3 { font-size: 16px; font-weight: 500; line-height: 1.3; }
    .pcard-body p { font-family: var(--mono); font-size: 12px; line-height: 1.6; color: var(--text-2); white-space: pre-wrap; }

    /* Pricing */
    .pricing { align-items: center; padding-top: clamp(28px,6vw,72px); }
    .pricing-head { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; max-width: 640px; }
    .pricing-head h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(44px,6vw,80px); line-height: 1; }
    .pricing-head .tabs { margin-top: 6px; }
    .plans { width: 100%; max-width: 1100px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,280px), 1fr)); gap: 16px; }
    .plan { border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
    .plan.hi { border-color: var(--accent); background: var(--panel); }
    .plan-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 22px; }
    .plan-top b { font-size: 17px; font-weight: 600; }
    .plan-top span { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--bg); padding: 3px 7px; border-radius: 4px; }
    .plan-price { display: flex; align-items: baseline; gap: 6px; }
    .plan-price span:first-child { font-family: var(--serif); font-size: 60px; line-height: 1; }
    .plan-price span:last-child { color: var(--dim); font-size: 14px; }
    .plan > p { font-size: 14px; color: var(--muted); line-height: 1.5; min-height: 42px; }
    .features { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
    .features div { display: flex; gap: 10px; font-size: 14px; line-height: 1.4; }
    .features div.no { color: var(--dim); }
    .features div span { width: 14px; flex: none; }
    .plan .btn { margin-top: auto; padding: 12px; }
    .fine { color: var(--dim); font-size: 13px; text-align: center; }

    /* Library */
    .plan-card { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
    .plan-card div { display: flex; flex-direction: column; gap: 2px; }
    .plan-card small { font-size: 12px; color: var(--dim); }
    .plan-card b { font-weight: 600; }
    .plan-card .btn { font-size: 13px; padding: 8px 14px; }
    .empty-box { padding: 56px 24px; border: 1px dashed var(--line-2); border-radius: 14px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; color: var(--muted); }
    .rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .row .mini { cursor: pointer; width: 48px; aspect-ratio: 9/16; border-radius: 6px; border: 0; padding: 0; }
    .row-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .row-title button { background: none; border: 0; padding: 0; color: var(--text); font-weight: 500; text-align: left; }
    .row-title small { font-family: var(--mono); font-size: 11px; color: var(--dim); }
    .row-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .row-acts .btn { font-size: 12px; padding: 7px 12px; }

    /* Studio */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .stats div { background: var(--bg); padding: 22px; display: flex; flex-direction: column; gap: 6px; }
    .stats small { font-size: 13px; color: var(--dim); }
    .stats b { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1; }
    .stats i { font-family: var(--mono); font-size: 11px; color: var(--accent); font-style: normal; }
    .studio { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,380px), 1fr)); gap: 32px; align-items: start; }
    .studio h2 { font-size: 17px; font-weight: 600; }
    .sales { display: flex; flex-direction: column; gap: 12px; }
    .sale { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 14px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .sale div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .sale div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sale small { font-size: 12px; color: var(--dim); }
    .sale .who { font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
    .sale .amt { font-family: var(--mono); font-weight: 500; white-space: nowrap; }
    .upload { display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line); border-radius: 14px; padding: 22px; background: var(--panel); }
    .drop { border: 1.5px dashed var(--line-2); border-radius: 10px; padding: 22px; display: flex; align-items: center; gap: 14px; color: var(--dim); }
    .drop > span { font-size: 24px; color: var(--accent); }
    .drop div { display: flex; flex-direction: column; gap: 3px; }
    .drop b { color: var(--text); font-weight: 400; }
    .drop small { font-family: var(--mono); font-size: 11px; }
    .field { display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--muted); }
    .field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; color: var(--text); font-size: 14px; outline: 0; }
    .field textarea { font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .fields.three { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .upload > .btn { padding: 12px; }

    footer { margin-top: auto; padding: 24px var(--pad-x); border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--dim); }
    footer div { display: flex; gap: 16px; }

    /* Checkout */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; }
    .modal { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 18px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-head b { font-size: 17px; font-weight: 600; }
    .modal-head button { background: transparent; border: 0; color: var(--dim); font-size: 20px; }
    .order { display: flex; justify-content: space-between; gap: 12px; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
    .order div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .order b { font-weight: 500; }
    .order small { font-size: 12px; color: var(--dim); }
    .order > span { font-family: var(--serif); font-size: 30px; line-height: 1; white-space: nowrap; }
    .modal .btn { padding: 13px; font-size: 15px; }
    .modal .fine { font-size: 12px; }
    .field .card-input { font-family: var(--mono); }
  </style>
</head>
<body>
<div class="app">
  <header>
    <button class="logo" data-act="go" data-view="browse" aria-label="Promptreel home"><span>Promptreel</span><span class="dot"></span></button>
    <nav id="nav"></nav>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search videos &amp; prompts" aria-label="Search videos and prompts" /></label>
    <span id="plan-badge" class="plan-badge"></span>
    <button id="subscribe" class="btn btn-accent" data-act="go" data-view="pricing">Subscribe</button>
  </header>

  <div id="view"></div>

  <footer>
    <span>Promptreel — AI videos &amp; prompts, made by one creator.</span>
    <div><a href="#">License terms</a><a href="#">Refunds</a><a href="#">Contact</a></div>
  </footer>
</div>

  {id:8,category:'Cinematic',title:'Rain on a neon rooftop',model:'Runway Gen-4',duration:'0:10',tone:'#26303a',sales:48,date:'Jul 30, 2026',tier:'starter',pp:3,vp:8,setting:'Tokyo rooftop at night, heavy rain, neon reflecting in puddles.',shots:'0.0–4s   Dolly over puddle reflections.\n4–10s    Rise to reveal the skyline.',audio:'Rain, distant traffic.',style:'Cinematic, anamorphic, 35mm'}
];
const CATS = ['All', 'Extreme POV', 'Anatomy', 'Cinematic', 'Product ads'];
const PLANS = {
  free: {name:'Free',m:0,y:0,blurb:'Watch every preview and grab the free items.',features:[['✓','All watermarked previews'],['✓','Free prompts & videos'],['—','Paid prompts'],['—','HD video downloads']]},
  starter: {name:'Starter',m:9,y:86,blurb:'For people who mainly want prompts.',features:[['✓','Every Starter prompt, copy anytime'],['✓','10 HD video downloads / month'],['✓','Personal-use license'],['—','Pro-only items']]},
  pro: {name:'Pro',m:24,y:230,blurb:'Everything in the store, for commercial work.',features:[['✓','Every prompt and video'],['✓','Unlimited 4K downloads, no watermark'],['✓','Commercial license'],['✓','New drops the day they land']]}
};
const RANK = {free: 0, starter: 1, pro: 2};
const TABS = [['Videos','browse'], ['Prompts','prompts'], ['Pricing','pricing'], ['My library','library'], ['Studio','studio']];
const STATS = [['Revenue','$1,284','+18% vs Aug'], ['Item sales','96','$642 one-time'], ['Subscribers','41','$642 recurring'], ['Preview views','38.2K','2.5% buy rate']];
const SALES = [['Mount Huashan plank walk','Video','2h ago','m***@gmail','$12.00'], ['Pro plan','Subscription','3h ago','a***@yahoo','$24.00'], ['Knee in a squat','Prompt','5h ago','k***@outlook','$5.00'], ['Caminito del Rey','Video','8h ago','j***@gmail','$9.00'], ['Starter plan','Subscription','1d ago','r***@gmail','$9.00'], ['Floating sneaker','Video','1d ago','studio***','$15.00']];

// ?view=detail&plan=pro lets you deep-link into any screen, like the design's startView / startPlan props.
const params = new URLSearchParams(location.search);
const state = {
  view: TABS.some(t => t[1] === params.get('view')) || params.get('view') === 'detail' ? params.get('view') : 'browse',
  sel: 1, cat: 'All', access: 'all', query: '',
  plan: PLANS[params.get('plan')] ? params.get('plan') : 'free',
  billing: 'm', owned: {}, checkout: null, copied: false, copiedId: null, dl: false
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const stripes = (tone, w = 10) => `background:repeating-linear-gradient(135deg,${tone} 0 ${w}px,#1a1a17 ${w}px ${w * 2}px)`;
const byId = id => V.find(v => v.id === id);

function covered(v, plan = state.plan) { return v.tier === 'free' || (v.tier !== 'paid' && RANK[plan] >= RANK[v.tier]); }
function access(v) {
  const o = state.owned[v.id], cov = covered(v);
  return { prompt: cov || !!o, video: v.tier === 'free' || o === 'video' || (cov && RANK[state.plan] >= 1) };
}
function sections(v) {
  return [['FORMAT', `9:16 vertical, ${v.duration.replace('0:', '')}s, ${v.model}`], ['SETTING', v.setting], ['SHOTS', v.shots], ['AUDIO', v.audio], ['STYLE', v.style]];
}
const promptText = v => sections(v).map(([l, b]) => `${l}: ${b}`).join('\n\n');
function matches(v) {
  const q = state.query.toLowerCase();
  return (state.cat === 'All' || v.category === state.cat) && (!q || (v.title + v.setting + v.style + v.model).toLowerCase().includes(q));
}
function badge(v) {
  const a = access(v), o = state.owned[v.id];
  if (a.prompt) return { label: o ? 'OWNED' : 'UNLOCKED', lit: true };
  return { label: v.tier === 'free' ? 'FREE' : v.tier === 'paid' ? 'PAID ONLY' : v.tier.toUpperCase(), lit: false };
}
function priceLine(v) {
  const a = access(v), o = state.owned[v.id];
  return v.tier === 'free' ? 'Free' : a.prompt ? (o ? 'In your library' : 'Included in your plan') : `From $${v.pp}`;
}
const priceLit = v => access(v).prompt || v.tier === 'free';
const tierName = v => v.tier === 'paid' ? null : v.tier === 'pro' ? 'Pro' : 'Starter';

function copyText(text) { navigator.clipboard?.writeText(text).catch(() => {}); }
function go(view, extra = {}) { Object.assign(state, { view, copied: false, dl: false }, extra); render(); window.scrollTo(0, 0); }

/* ---------- Views ---------- */

function videoCard(v) {
  const b = badge(v);
  return `<button class="card" data-act="open" data-id="${v.id}">
    <div class="thumb" style="${stripes(v.tone)}">
      <span class="tag" style="top:10px;left:10px">${esc(v.model)}</span>
      <span class="tag${b.lit ? ' lit' : ''}" style="top:10px;right:10px;letter-spacing:.04em">${b.label}</span>

      <span class="tag" style="bottom:10px;left:10px;padding:3px 7px;letter-spacing:0;background:rgba(14,14,12,.7);color:#b7b4ab">PREVIEW</span>
      <div class="play"><span>▶</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px">

    </div>
  </button>`;
}

function chips(withCount) {
  return `<div class="chips">${CATS.map(k => `<button class="chip${k === state.cat ? ' on' : ''}" data-act="cat" data-cat="${k}">${k}${withCount ? `<small>${k === 'All' ? V.length : V.filter(v => v.category === k).length}</small>` : ''}</button>`).join('')}</div>`;
}

}

  return `<main style="padding-top:clamp(20px,4vw,48px);gap:48px">

          ${a.prompt ? '' : '<span class="watermark">PROMPTREEL</span>'}
          <div class="progress"><div></div></div>

          </div>

        </button>`).join('')}

    </section>
  </main>`;
}

  const billing = [['Monthly','m'], ['Yearly · save 20%','y']].map(([l, k]) => `<button class="tab md${state.billing === k ? ' on' : ''}" data-act="billing" data-billing="${k}">${l}</button>`).join('');
  const plans = Object.entries(PLANS).map(([k, p]) => {

    return `<div class="plan${hi ? ' hi' : ''}">
      <div class="plan-top"><b>${p.name}</b>${tag ? `<span style="background:${cur ? 'var(--text)' : 'var(--accent)'}">${tag}</span>` : ''}</div>
      <div class="plan-price"><span>$${state.billing === 'm' ? p.m : p.y}</span><span>${per}</span></div>

      <div class="modal-head"><b>Checkout</b><button data-act="close" aria-label="Close">×</button></div>
      <div class="order"><div><b>${esc(order.title)}</b><small>${order.sub}</small></div><span>${order.price}</span></div>
      <label class="field">Email<input type="email" placeholder="you@email.com" /></label>
      <label class="field">Card<input class="card-input" placeholder="1234 1234 1234 1234   MM/YY   CVC" autocomplete="off" /></label>
      <button class="btn btn-accent" data-act="pay">Pay ${order.price}</button>
      <span class="fine">${order.fine}<br />Demo checkout: nothing is charged and nothing you type is sent anywhere.</span>
    </div>
  </div>`;
}

const VIEWS = { browse: browseView, detail: detailView, prompts: promptsView, pricing: pricingView, library: libraryView, studio: studioView };

function render() {
  document.getElementById('nav').innerHTML = TABS.map(([l, v]) => {
    const on = state.view === v || (v === 'browse' && state.view === 'detail');
    return `<button class="tab${on ? ' on' : ''}" data-act="go" data-view="${v}"${on ? ' aria-current="page"' : ''}>${l}</button>`;
  }).join('');
  const badgeEl = document.getElementById('plan-badge');
  badgeEl.textContent = `${PLANS[state.plan].name.toUpperCase()} PLAN`;
  badgeEl.classList.toggle('paid', state.plan !== 'free');
  document.getElementById('subscribe').hidden = state.plan === 'pro';
  document.getElementById('view').innerHTML = VIEWS[state.view]();
  document.getElementById('modal').innerHTML = checkoutModal();
}

/* ---------- Events ---------- */

const ACTIONS = {
  go: d => go(d.view),
  open: d => go('detail', { sel: +d.id }),
  cat: d => { state.cat = d.cat; render(); },
  access: d => { state.access = d.access; render(); },
  billing: d => { state.billing = d.billing; render(); },
  buy: d => { state.checkout = { kind: 'item', id: +d.id, what: d.what }; render(); },
  plan: d => { if (d.plan === 'free') state.plan = 'free'; else state.checkout = { kind: 'plan', plan: d.plan }; render(); },
  close: () => { state.checkout = null; render(); },
  pay: () => {
    const co = state.checkout;
    if (co.kind === 'plan') state.plan = co.plan;
    else state.owned[co.id] = co.what === 'video' || state.owned[co.id] === 'video' ? 'video' : 'prompt';
    state.checkout = null; render();
  },
  copy: () => {
    copyText(promptText(byId(state.sel) || V[0]));
    state.copied = true; render();
    setTimeout(() => { state.copied = false; render(); }, 1800);
  },
  'copy-card': d => {
    const id = +d.id;
    copyText(promptText(byId(id)));
    state.copiedId = id; render();
    setTimeout(() => { if (state.copiedId === id) { state.copiedId = null; render(); } }, 1800);
  },
  download: () => {
    state.dl = true; render();
    setTimeout(() => { state.dl = false; render(); }, 1800);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  // Clicks inside the modal shouldn't bubble up to the overlay's close action.
  if (!el || (el.classList.contains('overlay') && e.target.closest('.modal'))) return;
  ACTIONS[el.dataset.act]?.(el.dataset);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.checkout) ACTIONS.close(); });
document.getElementById('q').addEventListener('input', e => {
  state.query = e.target.value;
  if (state.view !== 'browse' && state.view !== 'prompts') state.view = 'browse';
  render();
});

render();
</script>
</body>
</html>
