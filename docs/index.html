<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEBM to MP4</title>
  <meta name="description" content="Free WebM to MP4 converter that runs entirely in your browser. Files never leave your device." />
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1a1d23; --muted: #6b7280;
      --border: #e3e6eb; --accent: #2563eb; --accent-soft: #e8efff;
      --ok: #16a34a; --err: #dc2626; --bar: #e9ecf1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa1ad;
        --border: #2c3038; --accent: #5b8cff; --accent-soft: #1e2a45;
        --ok: #4ade80; --err: #f87171; --bar: #2c3038;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }

    .drop {
      border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
      padding: 40px 20px; text-align: center; cursor: pointer; transition: .15s;
    }
    .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
    .drop span { color: var(--muted); font-size: 14px; }

    .options {
      display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 18px 0 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    }
    .options label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    select {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; max-width: 100%;
    }
    .hint { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }
    .hint.err { color: var(--err); }

    ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
    li {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
    }
    .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
    .meta.err { color: var(--err); white-space: pre-wrap; }
    .meta.ok { color: var(--ok); }
    .bar { grid-column: 1 / -1; height: 6px; background: var(--bar); border-radius: 99px; overflow: hidden; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .bar.indeterminate > div { width: 30%; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
    a.btn {
      background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
      padding: 6px 14px; border-radius: 8px;
    }
    footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>WEBM → MP4</h1>
  <p class="sub">Convert WebM videos to MP4 right in your browser. Your files never leave your device.</p>

  <div class="drop" id="drop" tabindex="0">
    <strong>Drop .webm files here</strong>
    <span>or click to choose — multiple files supported</span>
    <input type="file" id="file" accept=".webm,video/webm,video/*" multiple hidden />
  </div>

  <div class="options">
    <label>Mode
      <select id="mode">
        <option value="convert" selected>Convert to H.264 — plays everywhere</option>
        <option value="quick">Quick — no re-encoding (seconds)</option>
      </select>
    </label>
    <label id="qualityLabel">Quality
      <select id="quality">
        <option value="high">High (larger file)</option>
        <option value="balanced" selected>Balanced</option>
        <option value="small">Small file</option>
      </select>
    </label>
    <label>Audio
      <select id="audio">
        <option value="1" selected>Keep</option>
        <option value="0">Remove</option>
      </select>
    </label>
  </div>
  <p class="hint" id="hint"></p>

  <ul id="list"></ul>

  <footer>
    Uses your device's video hardware via WebCodecs (<a href="https://mediabunny.dev" target="_blank" rel="noopener">Mediabunny</a>),
    with <a href="https://github.com/ffmpegwasm/ffmpeg.wasm" target="_blank" rel="noopener">ffmpeg.wasm</a> as a fallback. ·
    <a href="https://github.com/NavodWickramathunga/webm-to-mp4-converter" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>
</main>

<script type="module">
  const FFMPEG_CORE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
  const CRF = { high: '18', balanced: '23', small: '28' };
  // ?engine=ffmpeg forces the fallback engine (useful for testing).
  const FORCE_FFMPEG = new URLSearchParams(location.search).get('engine') === 'ffmpeg';

  const HINTS = {
    convert: 'Re-encodes to H.264 + AAC so the MP4 plays on any device. Uses your graphics hardware when the browser supports it.',
    quick: 'Copies the original video and audio into an MP4 without re-encoding — very fast. Plays in modern browsers, VLC and Windows 10/11, but some older players and older iPhones may not support it.',
  };

  const $ = (id) => document.getElementById(id);
  const drop = $('drop'), input = $('file'), list = $('list'), hint = $('hint');
  const queue = [];
  let busy = false;

  const fmtSize = (b) => b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  const fmtTime = (s) => s < 60 ? s.toFixed(1) + 's' : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
  const toSeconds = (t) => t.split(':').reduce((acc, v) => acc * 60 + parseFloat(v), 0);

  function updateHint() {
    hint.className = 'hint';
    hint.textContent = HINTS[$('mode').value];
    $('qualityLabel').style.display = $('mode').value === 'quick' ? 'none' : '';
  }
  $('mode').addEventListener('change', updateHint);
  updateHint();

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('keydown', (e) => (e.key === 'Enter' || e.key === ' ') && input.click());
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));

  function addFiles(files) {
    for (const file of files) {
      const li = document.createElement('li');
      li.innerHTML = `<div class="name"></div><div class="action"></div>
        <div class="bar"><div></div></div><div class="meta">Waiting…</div>`;
      li.querySelector('.name').textContent = file.name;
      list.prepend(li);
      queue.push({ file, li, opts: {
        mode: $('mode').value, quality: $('quality').value, audio: $('audio').value === '1',
      }});
    }
    next();
  }

  async function next() {
    if (busy || !queue.length) return;
    busy = true;
    const item = queue.shift();
    try { await convert(item); }
    catch (err) { setState(item.li, { error: String(err?.message || err) }); }
    busy = false;
    next();
  }

  function setState(li, { text, progress, error, done }) {
    const meta = li.querySelector('.meta'), bar = li.querySelector('.bar');
    meta.className = 'meta' + (error ? ' err' : done ? ' ok' : '');
    meta.textContent = error || text || '';
    bar.classList.toggle('indeterminate', progress === null);
    bar.firstElementChild.style.width = (progress ?? 0) + '%';
    if (error || done) bar.style.display = 'none';
  }

  async function convert({ file, li, opts }) {
    const started = performance.now();
    setState(li, { text: 'Preparing…', progress: null });

    let blob = null, engine = opts.mode === 'quick' ? 'no re-encoding' : 'fast engine';
    if (!FORCE_FFMPEG && 'VideoEncoder' in window) {
      try { blob = await convertWithWebCodecs(file, li, opts); }
      catch (err) { console.warn('WebCodecs conversion failed, falling back to ffmpeg.wasm:', err); }
    }
    if (!blob) {
      engine = 'compatibility mode';
      blob = await convertWithFFmpeg(file, li, opts);
    }

    const a = document.createElement('a');
    a.className = 'btn';
    a.href = URL.createObjectURL(blob);
    a.download = file.name.replace(/\.[^.]+$/, '') + '.mp4';
    a.textContent = 'Download MP4';
    li.querySelector('.action').append(a);
    const secs = (performance.now() - started) / 1000;
    setState(li, { text: `Done in ${fmtTime(secs)} — ${fmtSize(blob.size)} (was ${fmtSize(file.size)}) · ${engine}`, done: true });
  }

  // ---- Fast path: WebCodecs (uses the GPU's video encoder when available) ----

  let mediabunny = null;
  async function convertWithWebCodecs(file, li, opts) {
    const mb = mediabunny ??= await import('./vendor/mediabunny/mediabunny.min.mjs');
    const input = new mb.Input({ formats: mb.ALL_FORMATS, source: new mb.BlobSource(file) });
    try {
      const videoTrack = await input.getPrimaryVideoTrack();
      if (!videoTrack) throw new Error('No video track found');
      const audioTrack = opts.audio ? await input.getPrimaryAudioTrack() : null;

      let video = {}, audio = opts.audio ? {} : { discard: true };
      if (opts.mode === 'convert') {
        const quality = { high: mb.QUALITY_HIGH, balanced: mb.QUALITY_MEDIUM, small: mb.QUALITY_LOW }[opts.quality];
        // H.264 needs even dimensions.
        const width = videoTrack.displayWidth & ~1, height = videoTrack.displayHeight & ~1;
        if (!(await mb.canEncodeVideo('avc', { width, height, quality }))) return null;
        video = { codec: 'avc', quality, width, height, fit: 'fill', hardwareAcceleration: 'prefer-hardware' };
        if (audioTrack) {
          const ok = await mb.canEncodeAudio('aac', {
            numberOfChannels: audioTrack.numberOfChannels, sampleRate: audioTrack.sampleRate,
          });
          if (!ok) return null;
          audio = { codec: 'aac' };
        }
      }

      const output = new mb.Output({
        format: new mb.Mp4OutputFormat({ fastStart: 'in-memory' }),
        target: new mb.BufferTarget(),
      });
      const conversion = await mb.Conversion.init({ input, output, video, audio, showWarnings: false });
      if (!conversion.isValid) return null;
      const lostAudio = audioTrack && conversion.discardedTracks.some((d) => d.track.type === 'audio');
      if (lostAudio) return null; // let the fallback engine handle the audio properly

      conversion.onProgress = (p) => {
        const pct = Math.round(p * 100);
        setState(li, { text: `${opts.mode === 'quick' ? 'Copying' : 'Converting'}… ${pct}%`, progress: pct });
      };
      setState(li, { text: 'Converting…', progress: 0 });
      await conversion.execute();
      return new Blob([output.target.buffer], { type: 'video/mp4' });
    } finally {
      input.dispose?.();
    }
  }

  // ---- Fallback: ffmpeg.wasm (works everywhere, but CPU-only and slower) ----

  let ffmpeg = null;
  async function getFFmpeg(li) {
    if (ffmpeg) return ffmpeg;
    setState(li, { text: 'Loading compatibility engine (~30 MB, first time only)…', progress: null });
    const { FFmpeg } = await import('./vendor/ffmpeg/index.js');
    const { toBlobURL } = await import('./vendor/util/index.js');
    const ff = new FFmpeg();
    try {
      await ff.load({
        coreURL: await toBlobURL(`${FFMPEG_CORE}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${FFMPEG_CORE}/ffmpeg-core.wasm`, 'application/wasm'),
      });
    } catch (err) {
      hint.className = 'hint err';
      hint.textContent = 'Could not load the compatibility engine. Check your internet connection and reload the page.';
      throw err;
    }
    return (ffmpeg = ff);
  }

  async function convertWithFFmpeg(file, li, opts) {
    const ff = await getFFmpeg(li);
    const { fetchFile } = await import('./vendor/util/index.js');

    // Track progress from FFmpeg's log output ("Duration: …" then "time=…").
    let duration = null;
    const onLog = ({ message }) => {
      const d = /Duration: (\d+:\d+:[\d.]+)/.exec(message);
      if (d && duration === null) duration = toSeconds(d[1]) || null;
      const t = /time=(\d+:\d+:[\d.]+)/.exec(message);
      if (t) {
        const p = duration ? Math.min(99, Math.round(toSeconds(t[1]) / duration * 100)) : null;
        setState(li, { text: p == null ? `Converting… ${t[1].split('.')[0]} processed` : `Converting… ${p}%`, progress: p });
      }
    };
    ff.on('log', onLog);

    const inName = 'input.webm', outName = 'output.mp4';
    const args = opts.mode === 'quick'
      ? ['-i', inName, '-c:v', 'copy', ...(opts.audio ? ['-c:a', 'copy'] : ['-an'])]
      : ['-i', inName,
         '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
         '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', CRF[opts.quality], '-pix_fmt', 'yuv420p',
         ...(opts.audio ? ['-c:a', 'aac', '-b:a', '192k'] : ['-an'])];
    try {
      await ff.writeFile(inName, await fetchFile(file));
      setState(li, { text: 'Converting…', progress: null });
      const code = await ff.exec([...args, '-movflags', '+faststart', outName]);
      if (code !== 0) {
        throw new Error(opts.mode === 'quick'
          ? 'Quick mode can’t copy this video’s format into MP4. Switch Mode to “Convert to H.264” and try again.'
          : 'Conversion failed — the file may be damaged or not a supported video.');
      }
      const data = await ff.readFile(outName);
      return new Blob([data.buffer], { type: 'video/mp4' });
    } finally {
      ff.off('log', onLog);
      await ff.deleteFile(inName).catch(() => {});
      await ff.deleteFile(outName).catch(() => {});
    }
  }
</script>
</body>
</html>
